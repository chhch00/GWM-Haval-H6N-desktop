org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The project may live under a non-ASCII path; AGP refuses that by default.
android.overridePathCheck=true

# R8 is enabled but fullMode stays off: this app relies heavily on reflection
# into hidden platform APIs (SystemProperties, Car, ServiceManager,
# MediaController, StorageVolume), accessibility services, notification
# listeners and a raw Binder link. fullMode assumes "no reflection" and may
# merge or remove classes that are only reached that way.
android.enableR8.fullMode=false

# Run the Kotlin compiler in-process: forking a separate Kotlin daemon on top
# of the Gradle daemon costs a lot of memory on small machines.
kotlin.compiler.execution.strategy=in-process
